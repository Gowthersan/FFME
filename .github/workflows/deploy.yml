# ========================================
# DÉPLOIEMENT FFME - PRODUCTION (Docker)
# ========================================
# Déclenché automatiquement sur push vers main
# Build et déploie les containers Docker sur le serveur

name: Deploy FFME to Production

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        name: Build & Deploy Docker
        runs-on: ubuntu-latest

        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.PRIVATE_KEY }}
                  passphrase: ${{ secrets.PASSPHRASE_KEY }}
                  port: ${{ secrets.SERVER_PORT }}
                  command_timeout: 30m
                  script: |
                      set -e
                      echo "=========================================="
                      echo "=== DÉPLOIEMENT FFME - PRODUCTION      ==="
                      echo "=========================================="

                      # Configuration
                      DEPLOY_PATH="${{ secrets.SERVER_PATH }}/ffme"


                      echo ""
                      echo "=== 1. Préparation du répertoire ==="
                      mkdir -p "$DEPLOY_PATH"
                      cd "$DEPLOY_PATH"

                      # Clonage ou mise à jour du repo
                      if [ -d .git ]; then
                          echo "Repo git existant - Mise à jour..."
                          git remote set-url origin "$GIT_REPO" 2>/dev/null || git remote add origin "$GIT_REPO"
                          git fetch origin --prune
                          git reset --hard HEAD
                          git clean -fd
                          git checkout -B main origin/main
                      elif [ "$(ls -A 2>/dev/null)" ]; then
                          echo "Répertoire non vide sans git - Nettoyage et clonage..."
                          rm -rf ..?* .[!.]* * 2>/dev/null || true
                          git clone --depth=1 --branch main "$GIT_REPO" .
                      else
                          echo "Premier déploiement - Clonage du repo..."
                          git clone --depth=1 --branch main "$GIT_REPO" .
                      fi

                      echo "Dernier commit: $(git log -1 --oneline)"

                      echo ""
                      echo "=== 2. Création du fichier .env ==="
                      cat > .env << 'ENVEOF'
                      # Database
                      MONGO_URI=${{ secrets.MONGO_URI }}

                      # Authentication
                      JWT_SECRET=${{ secrets.JWT_SECRET }}

                      # FTP (fichiers)
                      FTP_HOST=${{ secrets.FTP_HOST }}
                      FTP_PORT=${{ secrets.FTP_PORT }}
                      FTP_USER=${{ secrets.FTP_USER }}
                      FTP_PASSWORD=${{ secrets.FTP_PASSWORD }}

                      # Email SMTP
                      SMTP_HOST=${{ secrets.SMTP_HOST }}
                      SMTP_PORT=${{ secrets.SMTP_PORT }}
                      SMTP_USER=${{ secrets.SMTP_USER }}
                      SMTP_PASS=${{ secrets.SMTP_PASS }}

                      # Singpay (paiements)
                      SINGPAY_CLIENT_ID=${{ secrets.SINGPAY_CLIENT_ID }}
                      SINGPAY_CLIENT_SECRET=${{ secrets.SINGPAY_CLIENT_SECRET }}
                      SINGPAY_WALLET_ID=${{ secrets.SINGPAY_WALLET_ID }}
                      SINGPAY_DISBURSEMENT_ID=${{ secrets.SINGPAY_DISBURSEMENT_ID }}
                      ENVEOF
                      echo "✅ Fichier .env créé"

                      echo ""
                      echo "=== 3. Vérification Docker ==="
                      if ! command -v docker &> /dev/null; then
                          echo "❌ Docker non installé!"
                          exit 1
                      fi
                      docker --version
                      docker compose version || docker-compose --version

                      echo ""
                      echo "=== 4. Arrêt des anciens containers ==="
                      docker compose down --remove-orphans 2>/dev/null || true
                      docker stop ffme-client ffme-server 2>/dev/null || true
                      docker rm ffme-client ffme-server 2>/dev/null || true

                      echo ""
                      echo "=== 5. Nettoyage des anciennes images ==="
                      docker image prune -f
                      # Supprimer les anciennes images FFME pour forcer un rebuild propre
                      docker rmi $(docker images -q 'ffme-*' 2>/dev/null) 2>/dev/null || true
                      docker rmi $(docker images -q '*ffme*' 2>/dev/null) 2>/dev/null || true

                      echo ""
                      echo "=== 6. Build des images Docker ==="
                      echo "⏳ Build en cours (peut prendre plusieurs minutes)..."
                      docker compose build --no-cache --progress=plain

                      echo ""
                      echo "=== 7. Démarrage des containers ==="
                      docker compose up -d --force-recreate

                      echo ""
                      echo "=== 8. Attente du démarrage ==="
                      echo "⏳ Attente de 30 secondes pour le démarrage des services..."
                      sleep 30

                      echo ""
                      echo "=== 9. Vérification des services ==="

                      # Vérification du serveur
                      MAX_RETRIES=5
                      RETRY=0
                      SERVER_OK=false
                      while [ $RETRY -lt $MAX_RETRIES ]; do
                          if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                              echo "✅ Server API: OK (port 3000)"
                              SERVER_OK=true
                              break
                          else
                              RETRY=$((RETRY+1))
                              echo "⏳ Tentative $RETRY/$MAX_RETRIES - Server ne répond pas encore..."
                              sleep 5
                          fi
                      done

                      if [ "$SERVER_OK" = false ]; then
                          echo "❌ Server API: FAILED"
                          echo "--- Logs serveur ---"
                          docker logs ffme-server --tail 50 2>/dev/null || true
                      fi

                      # Vérification du client
                      RETRY=0
                      CLIENT_OK=false
                      while [ $RETRY -lt $MAX_RETRIES ]; do
                          if curl -sf http://localhost:4200 > /dev/null 2>&1; then
                              echo "✅ Client: OK (port 4200)"
                              CLIENT_OK=true
                              break
                          else
                              RETRY=$((RETRY+1))
                              echo "⏳ Tentative $RETRY/$MAX_RETRIES - Client ne répond pas encore..."
                              sleep 5
                          fi
                      done

                      if [ "$CLIENT_OK" = false ]; then
                          echo "❌ Client: FAILED"
                          echo "--- Logs client ---"
                          docker logs ffme-client --tail 50 2>/dev/null || true
                      fi

                      echo ""
                      echo "=== 10. Status final ==="
                      docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E "(NAMES|ffme)" || true

                      echo ""
                      if [ "$SERVER_OK" = true ] && [ "$CLIENT_OK" = true ]; then
                          echo "=========================================="
                          echo "=== ✅ DÉPLOIEMENT RÉUSSI              ==="
                          echo "=========================================="
                          echo "Client: http://localhost:4200"
                          echo "API:    http://localhost:3000/api"
                          exit 0
                      else
                          echo "=========================================="
                          echo "=== ❌ DÉPLOIEMENT ÉCHOUÉ              ==="
                          echo "=========================================="
                          exit 1
                      fi
