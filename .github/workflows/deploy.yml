name: Deploy FFME to Production Server

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    SERVER_HOST: ${{ secrets.SERVER_HOST }}
    SERVER_PORT: ${{ secrets.SERVER_PORT }}
    SERVER_USER: ${{ secrets.SERVER_USER }}
    SERVER_PATH: ${{ secrets.SERVER_PATH }}
    APP_FOLDER: ffme
    DEPLOY_PATH: ${{ secrets.SERVER_PATH }}/ffme

jobs:
    deploy:
        name: Deploy FFME Application
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup SSH Key
              env:
                  SSH_PASSPHRASE: ${{ secrets.PASSPHRASE_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -p ${{ env.SERVER_PORT }} ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

                  sudo apt-get update && sudo apt-get install -y expect

                  eval $(ssh-agent -s)
                  echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
                  echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

                  expect << 'EXPECT_EOF'
                  spawn ssh-add /home/runner/.ssh/id_rsa
                  expect "Enter passphrase"
                  send "$env(SSH_PASSPHRASE)\r"
                  expect eof
                  EXPECT_EOF

                  ssh-add -l

            - name: Create deployment directory
              run: |
                  ssh -p ${{ env.SERVER_PORT }} -o StrictHostKeyChecking=no \
                    ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} \
                    "mkdir -p ${{ env.DEPLOY_PATH }}"

            - name: Sync files to server
              run: |
                  # Create archive (ignore "file changed" warning - exit code 1)
                  tar --exclude='.git' \
                      --exclude='node_modules' \
                      --exclude='dist' \
                      --exclude='.angular' \
                      --exclude='.env' \
                      --exclude='.env.local' \
                      --exclude='coverage' \
                      --exclude='*.log' \
                      --exclude='deploy.tar.gz' \
                      -czf deploy.tar.gz . 2>/dev/null || true

                  # Verify archive was created
                  if [ ! -f deploy.tar.gz ]; then
                    echo "Failed to create archive"
                    exit 1
                  fi

                  echo "Archive created: $(ls -lh deploy.tar.gz)"

                  # Upload archive to server
                  scp -P ${{ env.SERVER_PORT }} -o StrictHostKeyChecking=no \
                    deploy.tar.gz ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.DEPLOY_PATH }}/

                  # Extract on server and cleanup
                  ssh -p ${{ env.SERVER_PORT }} -o StrictHostKeyChecking=no \
                    ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} \
                    "cd ${{ env.DEPLOY_PATH }} && tar -xzf deploy.tar.gz && rm deploy.tar.gz"

                  rm deploy.tar.gz
                  echo "Files synced successfully"

            - name: Create environment file
              run: |
                  ssh -p ${{ env.SERVER_PORT }} -o StrictHostKeyChecking=no \
                    ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} \
                    "cat > ${{ env.DEPLOY_PATH }}/.env << 'ENVEOF'
                  MONGO_ROOT_USER=${{ secrets.MONGO_ROOT_USER }}
                  MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
                  MONGO_URI=${{ secrets.MONGO_URI }}
                  JWT_SECRET=${{ secrets.JWT_SECRET }}
                  FTP_HOST=${{ secrets.FTP_HOST }}
                  FTP_PORT=${{ secrets.FTP_PORT }}
                  FTP_USER=${{ secrets.FTP_USER }}
                  FTP_PASSWORD=${{ secrets.FTP_PASSWORD }}
                  SMTP_HOST=${{ secrets.SMTP_HOST }}
                  SMTP_PORT=${{ secrets.SMTP_PORT }}
                  SMTP_USER=${{ secrets.SMTP_USER }}
                  SMTP_PASS=${{ secrets.SMTP_PASS }}
                  SINGPAY_CLIENT_ID=${{ secrets.SINGPAY_CLIENT_ID }}
                  SINGPAY_CLIENT_SECRET=${{ secrets.SINGPAY_CLIENT_SECRET }}
                  SINGPAY_WALLET_ID=${{ secrets.SINGPAY_WALLET_ID }}
                  SINGPAY_DISBURSEMENT_ID=${{ secrets.SINGPAY_DISBURSEMENT_ID }}
                  ENVEOF"

            - name: Build and deploy Docker containers
              run: |
                  ssh -p ${{ env.SERVER_PORT }} -o StrictHostKeyChecking=no \
                    ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'ENDSSH'
                  cd ${{ env.DEPLOY_PATH }}

                  echo "=== Stopping existing containers ==="
                  docker compose down --remove-orphans 2>/dev/null || true
                  docker stop ffme-client ffme-server ffme-mongodb 2>/dev/null || true
                  docker rm ffme-client ffme-server ffme-mongodb 2>/dev/null || true

                  echo "=== Removing old images ==="
                  docker rmi $(docker images -q '*ffme*' 2>/dev/null) 2>/dev/null || true

                  echo "=== Building Docker images ==="
                  docker compose build --no-cache

                  echo "=== Starting application ==="
                  docker compose up -d --force-recreate

                  echo "=== Cleaning up ==="
                  docker image prune -f

                  echo "=== Status ==="
                  docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep ffme || echo "Containers starting..."
                  ENDSSH

            - name: Verify deployment
              run: |
                  echo "Waiting 30s for containers to start..."
                  sleep 30
                  ssh -p ${{ env.SERVER_PORT }} -o StrictHostKeyChecking=no \
                    ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'ENDSSH'

                  echo "=== Checking containers ==="

                  if docker ps | grep -q ffme-server; then
                    echo "Server: OK"
                  else
                    echo "Server: FAILED"
                    docker logs ffme-server --tail 30 2>/dev/null || true
                  fi

                  if docker ps | grep -q ffme-client; then
                    echo "Client: OK"
                  else
                    echo "Client: FAILED"
                    docker logs ffme-client --tail 30 2>/dev/null || true
                  fi

                  echo ""
                  echo "=== Server logs ==="
                  docker logs ffme-server --tail 15 2>/dev/null || echo "No logs"

                  if docker ps | grep -q ffme-client && docker ps | grep -q ffme-server; then
                    echo ""
                    echo "=== DEPLOYMENT SUCCESSFUL ==="
                  else
                    echo ""
                    echo "=== DEPLOYMENT FAILED ==="
                    exit 1
                  fi
                  ENDSSH

            - name: Cleanup SSH agent
              if: always()
              run: |
                  ssh-agent -k 2>/dev/null || true
