services:
    server:
        build:
            context: .
            dockerfile: Dockerfile.server
        container_name: ffme-server
        restart: unless-stopped
        network_mode: host
        environment:
            NODE_ENV: production
            PORT: 3000
            JWT_SECRET: ${JWT_SECRET}
            MONGO_URI: ${MONGO_URI}
            FTP_HOST: ${FTP_HOST}
            FTP_PORT: ${FTP_PORT}
            FTP_USER: ${FTP_USER}
            FTP_PASSWORD: ${FTP_PASSWORD}
            SMTP_HOST: ${SMTP_HOST}
            SMTP_PORT: ${SMTP_PORT}
            SMTP_USER: ${SMTP_USER}
            SMTP_PASS: ${SMTP_PASS}
        volumes:
            - server_uploads:/app/uploads
            - server_assets:/app/assets

    client:
        build:
            context: .
            dockerfile: Dockerfile.client
        container_name: ffme-client
        restart: unless-stopped
        depends_on:
            - server
        ports:
            - '127.0.0.1:4200:80'
        networks:
            - ffme-network

networks:
    ffme-network:
        driver: bridge

volumes:
    server_uploads:
        driver: local
    server_assets:
        driver: local
