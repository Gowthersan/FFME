version: '3.8'

# Development environment with hot reload
services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: ffme-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: FFME
    volumes:
      - mongodb_data_dev:/data/db
    ports:
      - "27017:27017"
    networks:
      - ffme-network-dev

  # MongoDB UI (optional - for database management)
  mongo-express:
    image: mongo-express:latest
    container_name: ffme-mongo-express
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    ports:
      - "8081:8081"
    networks:
      - ffme-network-dev

  # Backend Server (with hot reload)
  server:
    build:
      context: .
      dockerfile: Dockerfile.server.dev
    container_name: ffme-server-dev
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      DB_URL: ${DB_URL}
      MONGO_URI: ${MONGO_URI}
      MAIL_API_KEY: ${MAIL_API_KEY}
      FTP_HOST: 51.77.212.203
      FTP_PORT: 22
      FTP_USER: junior
      FTP_PASSWORD: E9hSAcE62ai44a2gm99Y2AUzK4ugL8Qt
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    volumes:
      - ./server/app:/app/server/app:ro
      - ./common:/app/common:ro
      - server_uploads_dev:/app/uploads
    ports:
      - "5000:3000"
    networks:
      - ffme-network-dev

  # Frontend Client (Angular)
  client:
    build:
      context: .
      dockerfile: Dockerfile.client.dev
    container_name: ffme-client-dev
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "4200:80"
    networks:
      - ffme-network-dev

networks:
  ffme-network-dev:
    driver: bridge

volumes:
  mongodb_data_dev:
    driver: local
  server_uploads_dev:
    driver: local
