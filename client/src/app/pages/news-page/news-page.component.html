<app-navbar></app-navbar>

<app-title titre="NOS ACTUALITÉS"></app-title>

<app-loading-spinner [show]="isLoading"></app-loading-spinner>

<section class="articles-section container" *ngIf="!isLoading">
    <div
        class="article"
        *ngFor="let article of paginatedNews(); let i = index"
        [class.last]="i === paginatedNews().length - 1"
        [class.expanded]="isExpanded(article)"
        (click)="toggleExpanded(article)"
    >
        <div class="article-info">
            <div class="date">{{ formatDate(article.date) }}</div>
            <h2 class="title" [class.expanded]="isExpanded(article)">
                {{ isExpanded(article) ? article.title : truncate(article.title, 60) }}
            </h2>
            <p class="description" [class.expanded]="isExpanded(article)">
                {{ isExpanded(article) ? article.description : truncate(article.description, 150) }}
            </p>
            <a *ngIf="article.externalLink" [href]="article.externalLink" target="_blank" rel="noopener noreferrer" class="read-article-link" (click)="$event.stopPropagation()">
                Lire l'article complet
                <svg xmlns="http://www.w3.org/2000/svg" height="16" width="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zm-2 16H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7h-7z"/>
                </svg>
            </a>
        </div>

        <div
            class="article-image"
            [ngStyle]="{
                backgroundImage: 'url(' + getImageUrl(article.image) + ')',
                backgroundSize: 'cover',
                backgroundPosition: 'center'
            }"
        ></div>
    </div>

    <div class="pagination" *ngIf="totalPages > 1">
        <span *ngFor="let page of [].constructor(totalPages); let i = index" [class.active]="i + 1 === currentPage" (click)="goToPage(i + 1)">
            {{ i + 1 }}
        </span>
    </div>
</section>

<app-footer></app-footer>
