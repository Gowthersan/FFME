<app-loading-spinner [show]="isLoading"></app-loading-spinner>
<div class="with-sidebar">
    <div class="d-flex min-vh-100 overflow-hidden">
        <app-admin-sidebar class="sidebar-fixed"></app-admin-sidebar>

        <div class="main-content flex-grow-1 d-flex flex-column">
            <div class="sticky-header bg-white border-bottom p-3 d-flex justify-content-between align-items-center">
                <h2 class="m-0">Gestion de la Galerie</h2>
                <button class="btn btn-sm btn-primary px-4" (click)="openForm()">Ajouter une image</button>
            </div>

            <!-- Formulaire modal -->
            <app-form-photo
                *ngIf="showModal"
                [photo]="photoToEdit"
                [isEditMode]="isEditMode"
                [existingEvents]="objectKeys(eventFolders)"
                (submitted)="handleFormSubmit($event)"
                (deleted)="handlePhotoDelete($event)"
                (closed)="closeForm()"
            ></app-form-photo>

            <!-- Si aucun événement sélectionné, on affiche les dossiers -->
            <div class="row p-4" *ngIf="!selectedEvent">
                <h4 class="m-0">Liste des Évènements :</h4>
                <br /><br />

                <div class="col-md-3 mb-3" *ngFor="let eventName of objectKeys(eventFolders)">
                    <div class="card h-100" (click)="selectEvent(eventName)" style="cursor: pointer">
                        <div class="card-body d-flex align-items-center justify-content-center text-center">
                            <h5 class="card-title m-0">{{ eventName }}</h5>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Si un événement est sélectionné, on affiche les photos -->
            <div *ngIf="selectedEvent">
                <div class="d-flex align-items-center justify-content-between px-4 pt-3">
                    <button class="btn btn-link" (click)="selectedEvent = null">← Retour aux événements</button>
                    <h5 class="fw-bold">{{ selectedEvent }}</h5>
                </div>

                <div class="row px-4 pt-3">
                    <div class="col-md-3 mb-3" *ngFor="let photo of eventFolders[selectedEvent]">
                        <div class="card h-100 position-relative cursor: pointer" (click)="editPhoto(photo)">
                            <!-- Loader -->
                            <div class="dots-loader" *ngIf="!imageLoadedMap[photo.image]"><span></span><span></span><span></span></div>

                            <!-- Image -->
                            <img
                                [src]="getImageWithCache(photo.image)"
                                class="card-img-top"
                                alt="..."
                                loading="lazy"
                                decoding="async"
                                (load)="onImageLoad(photo.image)"
                                [class.image-hidden]="!imageLoadedMap[photo.image]"
                                [class.fade-in]="imageLoadedMap[photo.image]"
                            />

                            <div class="card-body">
                                <p class="card-text text-truncate">{{ photo.description }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
