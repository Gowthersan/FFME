<app-loading-spinner [show]="isLoading"></app-loading-spinner>
<app-admin-sidebar class="sidebar-fixed"></app-admin-sidebar>
<div class="with-sidebar">
    <div class="d-flex min-vh-100 overflow-hidden">
        <div class="main-content flex-grow-1 d-flex flex-column w-100">
            <div class="sticky-header bg-white border-bottom p-3 d-flex justify-content-between align-items-center">
                <h2 class="m-0">Gestion des Actualités</h2>
                <button class="btn btn-sm btn-primary px-4" (click)="openForm()">Ajouter une actualité</button>
            </div>

            <!-- Formulaire modal -->
            <app-form-news
                *ngIf="showModal"
                [news]="newsToEdit"
                [isEditMode]="isEditMode"
                (submitted)="handleFormSubmit($event)"
                (deleted)="handleNewsDelete($event)"
                (closed)="closeForm()"
            ></app-form-news>

            <div class="news-list p-4">
                <div class="news-item" *ngFor="let news of newsList" (click)="editNews(news)">
                    <div class="news-image">
                        <img [src]="getImageWithCache(news.image)" alt="Image de l’actualité" />
                    </div>
                    <div class="news-info">
                        <h5 class="mb-1">{{ news.title }}</h5>
                        <p class="small text-muted mb-1">{{ news.date | date: 'longDate' }}</p>
                        <p class="text-truncate">{{ news.description }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
