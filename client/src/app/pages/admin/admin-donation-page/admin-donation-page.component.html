<app-admin-sidebar class="sidebar-fixed"></app-admin-sidebar>

<div class="with-sidebar">
    <div class="main-content flex-grow-1 p-4">
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

        <ng-container *ngIf="don">
            <h2>Détail du don</h2>
            <hr />
            <p><strong>Nom :</strong> {{ don.lastName }}</p>
            <p><strong>Prénom :</strong> {{ don.firstName }}</p>
            <p><strong>Email :</strong> {{ don.email }}</p>
            <p><strong>Téléphone :</strong> {{ don.phone }}</p>
            <p><strong>Montant :</strong> {{ don.amount }} FCFA</p>

            <p>
                <strong>Statut de paiement : </strong>
                <select class="form-select d-inline w-auto" [(ngModel)]="don.isPaid" (change)="onStatusChange(don.isPaid)">
                    <option *ngFor="let s of statuses" [value]="s.value">{{ s.label }}</option>
                </select>
            </p>

            <p><strong>Moyen de paiement :</strong> {{ don.paymentMethod }}</p>

            <a routerLink="/admin/dons" class="btn btn-outline-primary mt-3">← Retour à la liste</a>
        </ng-container>
    </div>
</div>
