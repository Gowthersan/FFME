<section class="actualites-home">
    <h2>NOS ACTUALITÉS</h2>

    <div class="carousel">
        <div class="slides" [style.transform]="getTransform()">
            <div class="slide" *ngFor="let news of newsList; let i = index">
                <div class="slide-image" [style.backgroundImage]="'url(' + getImageUrl(news.image) + ')'"></div>
                <div class="slide-content">
                    <div class="date">{{ formatDate(news.date) }}</div>
                    <h3 class="title">{{ truncate(news.title, 60) }}</h3>
                    <a *ngIf="news.externalLink" [href]="news.externalLink" target="_blank" rel="noopener noreferrer" class="read-article-btn" (click)="$event.stopPropagation()">
                        Lire l'article
                        <svg xmlns="http://www.w3.org/2000/svg" height="16" width="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zm-2 16H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7h-7z"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <button class="prev" (click)="prevSlide()">&#10094;</button>
        <button class="next" (click)="nextSlide()">&#10095;</button>

        <div class="dots">
            <span *ngFor="let news of newsList; let i = index" class="dot" [class.active]="i === currentIndex" (click)="goToSlide(i)"></span>
        </div>
    </div>

    <div class="view-all-news" (click)="redirectToFullNews()">
        Voir toutes les actualités
        <span class="arrow">
            <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 17l5-5-5-5v10z" />
            </svg>
        </span>
    </div>
</section>
